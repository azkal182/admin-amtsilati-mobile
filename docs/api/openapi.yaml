openapi: 3.0.3
info:
  title: API SIDAFA v2
  version: 1.0.0
  description: |
    API backend SIDAFA v2 (read-only). Base URL: /api/v1.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Accounts
  - name: External Gateway
  - name: Internal Syahriyah
  - name: Internal Admin
  - name: Calendar Events
  - name: Health
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Provide refreshToken in body or in header "refreshtoken".
      parameters:
        - $ref: '#/components/parameters/RefreshTokenHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/auth/login:
    post:
      tags:
        - Internal Admin
      summary: Admin login (internal DB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/auth/token/refresh:
    post:
      tags:
        - Internal Admin
      summary: Refresh admin access token
      parameters:
        - $ref: '#/components/parameters/RefreshTokenHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Admin token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/auth/logout:
    post:
      tags:
        - Internal Admin
      summary: Admin logout
      responses:
        '200':
          description: Admin logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users:
    get:
      tags:
        - Internal Admin
      summary: List admin users
      security:
        - bearerAdminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Admin users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersPaginatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Internal Admin
      summary: Create admin user
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '200':
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/me:
    get:
      tags:
        - Internal Admin
      summary: Get current admin profile
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Admin profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/{id}/access:
    get:
      tags:
        - Internal Admin
      summary: Get effective roles and permissions for an admin user
      security:
        - bearerAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserIDParam'
      responses:
        '200':
          description: Admin user access retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserAccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/{id}/roles:
    post:
      tags:
        - Internal Admin
      summary: Assign a role to an admin user
      security:
        - bearerAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserIDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAdminRoleRequest'
      responses:
        '200':
          description: Admin user role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserAccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/{id}/roles/{roleCode}:
    delete:
      tags:
        - Internal Admin
      summary: Revoke a role from an admin user
      security:
        - bearerAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserIDParam'
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Admin user role revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserAccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/roles:
    get:
      tags:
        - Internal Admin
      summary: List available admin roles
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Admin roles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/permissions:
    get:
      tags:
        - Internal Admin
      summary: List available admin permissions
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Admin permissions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/{id}:
    patch:
      tags:
        - Internal Admin
      summary: Update admin user profile
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: Admin user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/users/{id}/password:
    patch:
      tags:
        - Internal Admin
      summary: Update admin user password
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminPasswordRequest'
      responses:
        '200':
          description: Admin password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPasswordUpdateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/store/products:
    get:
      tags:
        - Internal Admin
      summary: List store products (admin)
      security:
        - bearerAdminAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Store products retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreProductsPaginatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Internal Admin
      summary: Create store product
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStoreProductUpsertRequest'
      responses:
        '200':
          description: Store product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/store/products/{id}:
    get:
      tags:
        - Internal Admin
      summary: Get store product by id (admin)
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Store product retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Internal Admin
      summary: Update store product
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStoreProductUpsertRequest'
      responses:
        '200':
          description: Store product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/store/uploads/sign:
    post:
      tags:
        - Internal Admin
      summary: Generate signed upload params for Cloudinary
      security:
        - bearerAdminAuth: []
      responses:
        '200':
          description: Store upload signature generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreUploadSignResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/students:
    get:
      tags:
        - Internal Admin
      summary: List students from internal snapshot
      security:
        - bearerAdminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Students snapshot retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentsPaginatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/students/{idSantri}:
    get:
      tags:
        - Internal Admin
      summary: Get student snapshot by idSantri
      security:
        - bearerAdminAuth: []
      parameters:
        - name: idSantri
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student snapshot retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
        - Users
      summary: Get all users (paginated)
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user detail
      description: Returns the current user profile without password hash or device token.
      security:
        - bearerUserAuth: []
      responses:
        '200':
          description: User detail retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/balance:
    get:
      tags:
        - Accounts
      summary: Get saldo tabungan + UPT
      security:
        - bearerUserAuth: []
      responses:
        '200':
          description: Saldo retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaldoResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/upt/balance:
    get:
      tags:
        - Accounts
      summary: Get saldo UPT
      security:
        - bearerUserAuth: []
      responses:
        '200':
          description: Saldo UPT retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaldoUptResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/savings/transactions:
    get:
      tags:
        - Accounts
      summary: Get history tabungan
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: History tabungan retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransaksiHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/upt/transactions:
    get:
      tags:
        - Accounts
      summary: Get history UPT
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: History UPT retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UptHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/syahriyah/transactions:
    get:
      tags:
        - Accounts
      summary: Get history syahriyah
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: History syahriyah retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyahriyahHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/payments:
    get:
      tags:
        - Accounts
      summary: Get history pembayaran
      security:
        - bearerUserAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: History pembayaran retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PembayaranHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /accounts/activities/latest:
    get:
      tags:
        - Accounts
      summary: Get latest merged activities (upt, syahriyah, payments)
      security:
        - bearerUserAuth: []
      parameters:
        - name: limit
          in: query
          description: Max merged items returned
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: categories
          in: query
          description: "Filter categories (comma separated). Allowed: tabungan, upt, syahriyah, payments"
          schema:
            type: string
            example: tabungan,upt,payments
      responses:
        '200':
          description: Latest activities retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestActivitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /students/permit:
    get:
      tags:
        - External Gateway
      summary: Gateway permit by authenticated student's NIS
      description: Forwards request to external API `/api/v2/students/nis/:nis/permit` using NIS from current JWT user.
      security:
        - bearerUserAuth: []
      responses:
        '200':
          description: External permit retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalPermitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /students/attendance:
    get:
      tags:
        - External Gateway
      summary: Gateway attendance by authenticated student's NIS
      description: Forwards request to external API `/api/v2/students/nis/:nis/attendance` using NIS from current JWT user.
      security:
        - bearerUserAuth: []
      responses:
        '200':
          description: External attendance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAttendanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
