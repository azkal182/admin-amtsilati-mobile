                $ref: '#/components/schemas/AdminCalendarEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Internal Admin
      summary: Create a calendar event
      description: Requires events.manage.
      security:
        - bearerAdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventRequest'
      responses:
        '200':
          description: Calendar event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/admin/events/{id}:
    get:
      tags:
        - Internal Admin
      summary: Get a calendar event by UUID
      description: Requires events.manage or events.publish.
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calendar event retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Internal Admin
      summary: Update a calendar event
      description: Requires events.manage for detail changes; events.publish may only change status between DRAFT and PUBLISHED.
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventPatchRequest'
      responses:
        '200':
          description: Calendar event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Internal Admin
      summary: Archive a calendar event
      description: Requires events.manage.
      security:
        - bearerAdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calendar event archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventArchiveResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerUserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        default: 100
    SearchParam:
      name: search
      in: query
      description: Search by nama or username
      schema:
        type: string
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AdminUserIDParam:
      name: id
      in: path
      required: true
      description: Internal admin user ID
      schema:
        type: integer
        format: int64
    RefreshTokenHeader:
      name: refreshtoken
      in: header
      required: false
      description: Refresh token (alternative to request body)
      schema:
        type: string
    InternalAccessTokenHeader:
      name: X-Internal-Token
      in: header
      required: false
      description: Optional internal guard token for internal Syahriyah endpoints
      schema:
        type: string
    CalendarScopeParam:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [NATIONAL, PESANTREN]
    CalendarCategoryParam:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum: [ISLAMIC, NATIONAL, ACADEMIC, PESANTREN, PAYMENT, HOLIDAY, ANNOUNCEMENT, OTHER]
    CalendarStatusParam:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [DRAFT, PUBLISHED, ARCHIVED]
    FromGregorianParam:
      name: fromGregorian
      in: query
      required: false
      schema:
        type: string
        format: date
    ToGregorianParam:
      name: toGregorian
      in: query
      required: false
      schema:
        type: string
        format: date
    FromHijriYearParam:
      name: fromHijriYear
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ToHijriYearParam:
      name: toHijriYear
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    IncludeRecurringParam:
      name: includeRecurring
      in: query
      required: false
      description: Include YEARLY rules; defaults to true.
      schema:
        type: boolean
        default: true
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:

    UpsertTariffRequest:
      type: object
      properties:
        hijriPeriod:
          type: string
          example: "1447-01"
        category:
          type: string
          example: "santri_biasa"
        amount:
          type: integer
          format: int64
        createdBy:
          type: string
      required:
        - hijriPeriod
        - category
        - amount
    UpsertTariffData:
      type: object
      properties:
        saved:
          type: boolean
      required:
        - saved
    UpsertTariffResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UpsertTariffData'
          required:
            - data
    TariffListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UpsertTariffRequest'
          required:
            - data
    BillingPreviewData:
      type: object
      properties:
        idSantri:
          type: string
        hijriPeriod:
          type: string
        category:
          type: string
        amount:
          type: integer
          format: int64
        chargeable:
          type: boolean
        reason:
          type: string
        noProrata:
          type: boolean
        deterministic:
          type: boolean
      required:
        - idSantri
        - hijriPeriod
        - category
        - amount
        - chargeable
        - noProrata
        - deterministic
    BillingPreviewResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BillingPreviewData'
          required:
            - data

